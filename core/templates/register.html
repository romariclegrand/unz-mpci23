<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — UNZ-MPCI/23</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:#1D9E75; --green-dark:#085041;
      --dark:#1a1a2e; --darker:#0f0f1a;
      --text:#e8e8f0; --text-muted:#a0a0b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'DM Sans',sans-serif;
      background:var(--darker); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }
    .bg {
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 60% 60% at 70% 40%, rgba(29,158,117,0.1) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 70%, rgba(127,119,221,0.08) 0%, transparent 60%);
    }
    .card {
      position:relative; width:100%; max-width:440px; margin:20px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px; padding:40px;
    }
    .logo {
      font-family:'Syne',sans-serif; font-weight:800; font-size:1.5rem;
      color:#fff; text-align:center; margin-bottom:8px;
    }
    .logo span { color:var(--green); }
    .subtitle { text-align:center; font-size:0.88rem; color:var(--text-muted); margin-bottom:28px; line-height:1.5; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-size:0.82rem; font-weight:500; color:var(--text-muted); margin-bottom:6px; }
    input[type="text"], input[type="password"] {
      width:100%; padding:12px 16px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; color:var(--text);
      font-size:0.95rem; font-family:'DM Sans',sans-serif;
      outline:none; transition:border-color 0.2s;
    }
    input:focus { border-color:rgba(29,158,117,0.5); }
    input::placeholder { color:rgba(255,255,255,0.2); }
    .help-text { font-size:0.75rem; color:var(--text-muted); margin-top:4px; }
    .error-text { font-size:0.75rem; color:#f0997b; margin-top:4px; }
    .btn-register {
      width:100%; padding:14px;
      background:var(--green); color:#fff; border:none;
      border-radius:12px; font-size:1rem; font-weight:500;
      font-family:'DM Sans',sans-serif; cursor:pointer;
      transition:all 0.25s; margin-top:8px;
    }
    .btn-register:hover { background:var(--green-dark); transform:translateY(-1px); }
    .login-link { text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted); }
    .login-link a { color:var(--green); text-decoration:none; font-weight:500; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="logo">UNZ<span>·</span>MPCI<span>/23</span></div>
    <p class="subtitle">Crée ton compte pour rejoindre<br>la plateforme de la promotion 2023</p>

    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}
            <p class="help-text">{{ field.help_text }}</p>
          {% endif %}
          {% for error in field.errors %}
            <p class="error-text">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn-register">S'inscrire →</button>
    </form>
    <p class="login-link">Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
  </div>
</body>
</html>
